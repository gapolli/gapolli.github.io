name: Sincronizar Dados do Portfólio

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Buscar dados do GitHub API e gerar arquivo unificado
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Buscando dados da API..."
        # Endpoints corretos: api.github.com + nome de usuário + auth
        curl -s -H "Authorization: Bearer $GH_TOKEN" \
             -H "Accept: application/vnd.github+json" \
             "https://api.github.com/users/gapolli" -o profile.json
        curl -s -H "Authorization: Bearer $GH_TOKEN" \
             -H "Accept: application/vnd.github+json" \
             "https://api.github.com/users/gapolli/repos?sort=updated&per_page=100" -o repos_raw.json
        
        echo "Agrupando dados com jq..."
        # --slurpfile lê dos arquivos, evitando estouro de argumentos e problemas com escaping
        jq -n --slurpfile prof profile.json --slurpfile repos repos_raw.json \
          '{profile: $prof[0], repositories: $repos[0]}' > repos.json
          
        rm profile.json repos_raw.json

    - name: Commitar as alterações localmente
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        if [ -n "$(git status --porcelain repos.json)" ]; then
          git add repos.json
          git commit -m "chore: auto-update portfolio cache data [skip ci]"
        else
          echo "Nenhuma alteração detectada nos repositórios."
        fi

    - name: Push das alterações com Autenticação
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: main