name: Sincronizar Dados do Portfólio

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Buscar dados do GitHub API e gerar arquivo unificado
      run: |
        echo "Buscando dados da API..."
        # Faz o download direto para arquivos temporários usando os endpoints corretos da API
        curl -s "https://github.com/gapolli" -o profile.json
        curl -s "https://github.com/gapolli/repos?sort=updated&per_page=100" -o repos_raw.json
        
        echo "Agrupando dados com jq..."
        # O operador --argfile lê os arquivos direto do disco, evitando estouro de memória no terminal
        jq -n --argfile prof profile.json --argfile repos repos_raw.json \
          '{profile: $prof, repositories: $repos}' > repos.json
          
        # Limpa os arquivos temporários
        rm profile.json repos_raw.json

    - name: Commitar as alterações localmente
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        if [ -n "$(git status --porcelain repos.json)" ]; then
          git add repos.json
          git commit -m "chore: auto-update portfolio cache data [skip ci]"
        else
          echo "Nenhuma alteração detectada nos repositórios."
        fi

    - name: Push das alterações com Autenticação
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: main
