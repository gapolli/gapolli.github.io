name: Sincronizar Dados do Portfólio

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4
      with:
        persist-credentials: true

    - name: Buscar dados do GitHub API e gerar arquivo unificado
      run: |
        echo "Buscando dados da API..."
        # Baixa os conteúdos diretamente em texto estruturado nas variáveis
        PROFILE_DATA=$(curl -s "https://api.github.com/users/gapolli")
        REPOS_DATA=$(curl -s "https://api.github.com/users/gapolli/repos?sort=updated&per_page=100")
        
        echo "Agrupando dados de forma plana com jq..."
        # O uso de --argjson passa o objeto puro diretamente, garantindo uma estrutura perfeita e sem arrays aninhados
        jq -n --argjson prof "$PROFILE_DATA" --argjson repos "$REPOS_DATA" \
          '{profile: $prof, repositories: $repos}' > repos.json

    - name: Commitar as alterações localmente
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        if [ -n "$(git status --porcelain repos.json)" ]; then
          git add repos.json
          git commit -m "chore: auto-update portfolio cache data [skip ci]"
        else
          echo "Nenhuma alteração detectada nos repositórios."
        fi

    - name: Push das alterações com Autenticação
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: main